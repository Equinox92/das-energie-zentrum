<!-- [3.4.1]
     Scalable SVG-based interactive house visualization.
-->
<svg id="interactive-house"
     viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg">

    <!-- [3.4.2]
         Roof interaction zone.
    -->
    <polygon
        id="roof-zone"
        class="interactive-zone"
        data-zone="roof"
        points="200,40 80,140 320,140"
        fill="#7aa6c2"
        stroke="#004f71"
        stroke-width="4">
    </polygon>

    <!-- [3.4.3]
         Wall interaction zone.
    -->
    <rect
        id="wall-zone"
        class="interactive-zone"
        data-zone="walls"
        x="100"
        y="140"
        width="200"
        height="170"
        fill="#f5f5f5"
        stroke="#004f71"
        stroke-width="4">
    </rect>

    <!-- [3.4.4]
         Window interaction zone.
    -->
    <rect
        id="window-zone"
        class="interactive-zone"
        data-zone="windows"
        x="170"
        y="190"
        width="60"
        height="60"
        fill="#d9e5ea"
        stroke="#004f71"
        stroke-width="2">
    </rect>

    <!-- [3.4.5]
         Solar panel visualization layer.
         Initially hidden until roof upgrades are activated.
    -->
    <g id="solar-panel-system"
       visibility="hidden">

        <rect x="120"
              y="90"
              width="45"
              height="25"
              fill="#1f2937"
              stroke="#ffffff"
              stroke-width="1">
        </rect>

        <rect x="175"
              y="75"
              width="45"
              height="25"
              fill="#1f2937"
              stroke="#ffffff"
              stroke-width="1">
        </rect>

        <rect x="230"
              y="90"
              width="45"
              height="25"
              fill="#1f2937"
              stroke="#ffffff"
              stroke-width="1">
        </rect>

    </g>

    <!-- [3.4.6]
         Efficient wall insulation visualization overlay.
    -->
    <rect id="wall-insulation-overlay"
          x="100"
          y="140"
          width="200"
          height="170"
          fill="#90ee90"
          opacity="0"
          pointer-events="none">
    </rect>

    <!-- [3.4.7]
         Efficient window upgrade overlay.
    -->
    <rect id="efficient-window-overlay"
          x="170"
          y="190"
          width="60"
          height="60"
          fill="#87ceeb"
          opacity="0"
          pointer-events="none">
    </rect>

    <!-- =====================================================
     [5.11.1]
     ENERGY FLOW VISUALIZATION LAYER
===================================================== -->

<!-- [5.11.2]
     Simulated roof energy flow path.
-->
<circle
      class="energy-flow-particle"
    id="energy-flow-roof"
    cx="300"
    cy="120"
    r="14"
    fill="#00e5ff"
    opacity="0"
>
    <animateMotion
        dur="3s"
        repeatCount="indefinite"
        path="
          M 120 120
          Q 200 20 320 120
"></animateMotion>
</circle>

<!-- [5.11.3]
     Simulated wall energy flow path.
-->
<circle 
     class="energy-flow-particle"
    id="energy-flow-wall"
    cx="180"
    cy="260"
    r="14"
    fill="#00e5ff"
    opacity="0"
>
    <animateMotion
        dur="2.5s"
        repeatCount="indefinite"
        path="
            M 120 150
               L 120 320
        "></animateMotion>
    
</circle>

<!-- [5.11.4]
     Simulated window energy flow path.
-->
<circle 
class="energy-flow-particle"
    id="energy-flow-window"
    cx="300"
    cy="320"
    r="14"
    fill="#7df9ff"
    opacity="0"
>
    <animateMotion
        dur="2s"
        repeatCount="indefinite"
        path="
            M 150 220
               L 320 220
        "></animateMotion>
</circle>

<!-- ===================================================== -->
<!-- [8.1.1] ENGINEERING OVERLAY SYSTEMS -->
<!-- ===================================================== -->

<!-- [8.1.2] Solar engineering overlay layer -->
<!-- ===================================================== -->
<!-- [8.1.2] SOLAR ENGINEERING OVERLAY -->
<!-- ===================================================== -->

<g id="solar-overlay"
   opacity="0" pointer-events="none">

    <!-- Solar Panel 1 -->
    <rect
        x="120"
        y="95"
        width="50"
        height="24"
        fill="#1e293b"
        stroke="#facc15"
        stroke-width="2"
        rx="4"
    />

    <!-- Solar Panel 2 -->
    <rect
        x="180"
        y="78"
        width="50"
        height="24"
        fill="#1e293b"
        stroke="#facc15"
        stroke-width="2"
        rx="4"
    />

    <!-- Solar Panel 3 -->
    <rect
        x="240"
        y="95"
        width="50"
        height="24"
        fill="#1e293b"
        stroke="#facc15"
        stroke-width="2"
        rx="4"
    />

</g>

<!-- ===================================================== -->
<!-- [8.1.3] THERMAL WALL OVERLAY -->
<!-- ===================================================== -->

<g id="wall-overlay"
   opacity="0" pointer-events="none">

    <pattern
        id="thermal-pattern"
        width="12"
        height="12"
        patternUnits="userSpaceOnUse">

        <path
            d="M0 0 L12 12"
            stroke="#22d3ee"
            stroke-width="2"
        />

    </pattern>

    <rect
        x="100"
        y="140"
        width="200"
        height="170"
        fill="url(#thermal-pattern)"
        opacity="0.35"
    />

</g>

<!-- ===================================================== -->
<!-- [8.1.4] WINDOW ENGINEERING OVERLAY -->
<!-- ===================================================== -->

<g id="window-overlay"
   opacity="0" pointer-events="none">
   

    <rect
        x="170"
        y="190"
        width="60"
        height="60"
        fill="#60a5fa"
        opacity="0.45"
        rx="4"
    />

</g>
</svg>
